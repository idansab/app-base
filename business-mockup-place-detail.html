<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מה יש פה - Place Detail Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2EBD6F;
      --primary-light: #C8F0DC;
      --clay: #CE8560;
      --sand: #F5D9B5;
      --sky: #0BA3E0;
      --background: #F2F7FC;
      --text-primary: #1A2235;
      --text-secondary: #6B7A8F;
      --border: #D4E4F0;
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px rgba(0,0,0,0.15);
    }

    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--background) 0%, #E8F3F8 100%);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    /* Modal Container */
    .modal-container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 500px;
    }

    /* Modal */
    .modal {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: var(--shadow-xl);
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Modal Header */
    .modal-header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      text-align: right;
    }

    .close-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--sand);
      border: none;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .close-btn:hover {
      background: var(--primary-light);
      transform: scale(1.05);
    }

    /* Modal Content */
    .modal-content {
      padding: 24px;
      space: 24px;
    }

    .modal-content > * {
      margin-bottom: 24px;
    }

    .modal-content > *:last-child {
      margin-bottom: 0;
    }

    /* Hero Image */
    .hero-image {
      width: 100%;
      height: 240px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      overflow: hidden;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-primary);
      margin-bottom: 4px;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Details */
    .details-section {
      display: space: 12px;
    }

    .detail-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      text-align: right;
      margin-bottom: 12px;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .detail-icon {
      font-size: 20px;
      flex-shrink: 0;
      order: -1;
    }

    .detail-content {
      flex: 1;
    }

    .detail-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .detail-value.link {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }

    .detail-value.link:hover {
      text-decoration: underline;
    }

    /* Description */
    .description {
      background: var(--sand);
      border-radius: 12px;
      padding: 16px;
      text-align: right;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    /* Action Buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .action-btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
      font-family: 'Rubik';
    }

    .action-btn.primary {
      background: var(--primary);
      color: white;
    }

    .action-btn.primary:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    .action-btn.secondary {
      background: var(--sand);
      color: var(--text-primary);
    }

    .action-btn.secondary:hover {
      background: var(--primary-light);
      transform: scale(1.02);
    }

    .action-btn.outline {
      background: transparent;
      color: var(--text-primary);
      border: 1.5px solid var(--border);
    }

    .action-btn.outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Community Tips */
    .tips-section {
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .tips-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: right;
    }

    .tip-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'Rubik';
      font-size: 13px;
      text-align: right;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 8px;
    }

    .tip-submit {
      width: 100%;
      padding: 10px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Rubik';
      transition: all 0.3s;
    }

    .tip-submit:hover {
      transform: scale(1.02);
    }

    /* Mobile */
    @media (max-width: 600px) {
      .modal {
        border-radius: 20px;
      }

      .modal-content {
        padding: 16px;
      }

      .action-buttons {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body dir="rtl">
  <!-- Backdrop -->
  <div class="backdrop"></div>

  <!-- Modal -->
  <div class="modal-container">
    <div class="modal">
      <!-- Header -->
      <div class="modal-header">
        <button class="close-btn">✕</button>
        <div class="modal-title">טיול סלעים בנחל דוד</div>
      </div>

      <!-- Content -->
      <div class="modal-content">
        <!-- Hero Image -->
        <div class="hero-image">🏔️</div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">דירוג</div>
            <div class="stat-value">⭐ 4.8</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">מרחק</div>
            <div class="stat-value">3.2 ק״מ</div>
          </div>
        </div>

        <!-- Details -->
        <div class="details-section">
          <div class="detail-item">
            <div class="detail-icon">🕐</div>
            <div class="detail-content">
              <div class="detail-label">שעות פתיחה</div>
              <div class="detail-value">06:00–18:00</div>
            </div>
          </div>

          <div class="detail-item">
            <div class="detail-icon">📞</div>
            <div class="detail-content">
              <div class="detail-label">טלפון</div>
              <div class="detail-value link">02-5678910</div>
            </div>
          </div>

          <div class="detail-item">
            <div class="detail-icon">📍</div>
            <div class="detail-content">
              <div class="detail-label">כתובת</div>
              <div class="detail-value">נחל דוד, ירושלים</div>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="description">
          טיול משפחתי יפה בנחל דוד עם מפלים קטנים וביצות. מתאים לכל הגילאים. המסלול הוא קל ודורך בחזרה, וממש יפה מבחינה נופית.
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="action-btn primary">ניווט</button>
          <button class="action-btn secondary">שמור</button>
          <button class="action-btn outline">שתף</button>
        </div>

        <!-- Community Tips -->
        <div class="tips-section">
          <div class="tips-title">טיפים מהקהילה</div>
          <textarea class="tip-input" placeholder="שתף טיפ..."></textarea>
          <button class="tip-submit">שלח טיפ</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
