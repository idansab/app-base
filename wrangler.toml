name = "mah-yesh-po"
type = "javascript"
account_id = "2bf9335eb4120606b6337d0442cb902e"
workers_dev = true
main = "server.js"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
pages_build_output_dir = "dist"

# Build configuration
[build]
command = "npm run build"
cwd = "./"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }
routes = [
  { pattern = "mayheshpo.com/*", zone_name = "mayheshpo.com" }
]

# Staging environment
[env.staging]
vars = { ENVIRONMENT = "staging" }
routes = [
  { pattern = "staging.mayheshpo.com/*", zone_name = "mayheshpo.com" }
]

# Development environment
[env.development]
vars = { ENVIRONMENT = "development" }

# Secrets (set via wrangler secret put)
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mah-yesh-po-images"
preview_bucket_name = "mah-yesh-po-images-preview"

# KV Namespace for sessions (optional)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your_kv_namespace_id"
# preview_id = "your_preview_namespace_id"
