name = "mah-yesh-po"
type = "javascript"
account_id = "2bf9335eb4120606b6337d0442cb902e"
workers_dev = true
main = "dist/server.js"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
pages_build_output_dir = "dist"

# Environment variables
env.production.vars = { ENVIRONMENT = "production" }
env.staging.vars = { ENVIRONMENT = "staging" }
env.development.vars = { ENVIRONMENT = "development" }

# Secrets (set via wrangler secret put)
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - CF_R2_ACCESS_KEY_ID
# - CF_R2_SECRET_ACCESS_KEY

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mah-yesh-po-images"
preview_bucket_name = "mah-yesh-po-images-preview"

# Durable Objects (optional, for caching)
# [[durable_objects.bindings]]
# name = "CACHE"
# class_name = "Cache"

# Build configuration
[build]
command = "npm run build"
cwd = "./"

[env.production]
routes = [
  { pattern = "mayheshpo.com/*", zone_name = "mayheshpo.com" }
]

[env.staging]
routes = [
  { pattern = "staging.mayheshpo.com/*", zone_name = "mayheshpo.com" }
]

# KV Namespace for sessions (optional)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your_kv_namespace_id"
# preview_id = "your_preview_namespace_id"
