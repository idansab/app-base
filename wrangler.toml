# Cloudflare Pages configuration (Frontend only)
# Backend: Node.js Express server (runs separately)

name = "whatishere"
account_id = "2bf9335eb4120606b6337d0442cb902e"
type = "javascript"
compatibility_date = "2024-09-23"

# Build configuration
[build]
command = "npm run build"
cwd = "./"

# Static assets directory for Pages
[assets]
directory = "./dist"
binding = "ASSETS"

# Production environment
[env.production]
routes = [
  { pattern = "mayheshpo.com/*", zone_name = "mayheshpo.com" }
]
vars = {
  ENVIRONMENT = "production",
  API_URL = "https://api.mayheshpo.com"
}

# Staging environment
[env.staging]
routes = [
  { pattern = "staging.mayheshpo.com/*", zone_name = "mayheshpo.com" }
]
vars = {
  ENVIRONMENT = "staging",
  API_URL = "https://staging-api.mayheshpo.com"
}

# Development environment
[env.development]
vars = {
  ENVIRONMENT = "development",
  API_URL = "http://localhost:3001"
}
